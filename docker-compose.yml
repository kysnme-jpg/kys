# Local development database for ConsignPro.
# Start it with:  docker compose up -d
# Stop it with:   docker compose down       (data is kept)
# Reset it with:  docker compose down -v     (deletes all local data)
#
# Matches the default DATABASE_URL in .env.example:
#   postgresql://postgres:postgres@localhost:5432/consignpro
services:
  db:
    image: postgres:16
    container_name: consignpro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: consignpro
    ports:
      - "5432:5432"
    volumes:
      - consignpro-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consignpro"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  consignpro-pgdata:
